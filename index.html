<style>
:root{--bg:#f3f5fa;--panel:#fff;--text:#1a2333;--muted:#6b7280;--line:#d1d5db;--accent:#4f46e5;--good:#16a34a;--bad:#dc2626;}
html.dark{--bg:#0f172a;--panel:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--line:#334155;--accent:#818cf8;--good:#4ade80;--bad:#f87171;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;width:100vw;overflow:hidden}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
header h1{margin:0;font-size:16px}
.muted{color:var(--muted);font-size:11px}
main{flex:1;display:flex;flex-direction:column;max-width:640px;width:100%;margin:0 auto;padding:8px;overflow:hidden;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px;margin-bottom:6px}
.row{display:flex;gap:6px;flex-wrap:wrap} .row>button{flex:1;min-width:60px}
button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:10px;font-weight:700;cursor:pointer;font-size:13px}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}
button.active{outline:2px solid var(--accent)}
.q{font-size:19px;font-weight:800;line-height:1.2;margin:4px 0 8px;flex-shrink:0}
.topic{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;flex-shrink:0;display:flex;gap:4px;flex-wrap:wrap}
.topic span{background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:10px}
.opts{display:grid;gap:6px;flex-shrink:0}
.opt{text-align:left;padding:10px;font-size:15px;font-weight:600;border-radius:8px;line-height:1.2}
.opt.correct{border-color:var(--good);color:var(--good);background:rgba(22,163,74,.1)}
.opt.wrong{border-color:var(--bad);color:var(--bad);background:rgba(220,38,38,.1)}
.feedback{margin-top:6px;padding:6px 8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:13px;white-space:pre-wrap;flex-shrink:0;max-height:15vh;overflow:hidden}
.badge{background:var(--bad);color:white;padding:2px 6px;border-radius:8px;font-size:10px;font-weight:800}
#area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.flash{flex:1;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;background:var(--bg);cursor:pointer;overflow:hidden}
.flash .txt{font-size:20px;font-weight:800}
.cat-row{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;flex-shrink:0}
.cat-row button{white-space:nowrap;padding:6px 10px;font-size:11px;flex:0 0 auto}
</style>
</head>

  let row=document.createElement('div'); row.className='row'; row.style.marginTop='6px';
  let h=document.createElement('button'); h.textContent=hint?'💡 '+q.hint:'💡 Hint'; h.disabled=hint; h.onclick=()=>{hint=true; render();};
  let m=document.createElement('button'); m.textContent='🧠 '+q.memoryTip; m.onclick=()=>{hint=true; render();};
  let nxt=document.createElement('button'); nxt.className='primary'; nxt.textContent='Next'; nxt.style.display=answered?'block':'none'; nxt.onclick=()=>{idx++; answered=false; revealed=false; hint=false; order=[]; last=''; render();};
  row.append(h,m,nxt); area.appendChild(row);
  if(answered||hint){
    let fb=document.createElement('div'); fb.className='feedback';
    fb.textContent=answered? (last===q.answer?'✅ '+q.answer:'❌ '+q.answer) : '💡 '+q.hint;
    area.appendChild(fb);
  }
}
function renderCard(area,q){
  let t=document.createElement('div'); t.className='topic'; t.innerHTML='<span>'+q.topic+'</span><span>'+q.area+'</span>'; area.appendChild(t);
  let card=document.createElement('div'); card.className='flash'; card.onclick=()=>{revealed=!revealed; render();};
  card.innerHTML='<div class="txt">'+(revealed?q.answer:q.question)+'</div>';
  area.appendChild(card);
  let row=document.createElement('div'); row.className='row'; row.style.marginTop='6px';
  if(!revealed){
    let b=document.createElement('button'); b.className='primary'; b.style.width='100%'; b.textContent='Reveal'; b.onclick=()=>{revealed=true; render();}; row.appendChild(b);
  } else {
    let y=document.createElement('button'); y.className='primary'; y.textContent='✓'; y.onclick=()=>{missed.delete(q.id); idx++; revealed=false; hint=false; order=[]; render();};
    let n=document.createElement('button'); n.textContent='✗'; n.onclick=()=>{missed.add(q.id); idx++; revealed=false; hint=false; order=[]; render();};
    row.append(y,n);
  }
  area.appendChild(row);
}
$('subject').onchange=()=>reset(false);
$('quizMode').onclick=()=>{mode='quiz'; $('quizMode').classList.add('active'); $('cardMode').classList.remove('active'); reset(false);};
$('cardMode').onclick=()=>{mode='flashcards'; $('cardMode').classList.add('active'); $('quizMode').classList.remove('active'); reset(false);};
$('shuffleBtn').onclick=()=>{qs=shuffle(qs); idx=0; answered=false; revealed=false; hint=false; order=[]; last=''; render();};
$('restartBtn').onclick=()=>reset(true);
$('themeBtn').onclick=()=>{document.documentElement.classList.toggle('dark');};
allQs=norm(EMBEDDED);
let sub=$('subject');
let cats=[...new Set(allQs.map(q=>q.area))].sort();
sub.innerHTML='<option value="all">All ('+allQs.length+')</option>';
cats.forEach(c=>{let o=document.createElement('option'); o.value=c; o.textContent=c+' ('+allQs.filter(q=>q.area===c).length+')'; sub.appendChild(o);});
let catRow=$('catRow');
cats.forEach(c=>{
  let b=document.createElement('button');
  b.textContent=c;
  b.onclick=()=>{sub.value=c; reset(false); document.querySelectorAll('#catRow button').forEach(x=>x.classList.remove('active')); b.classList.add('active');};
  catRow.appendChild(b);
});
reset(true);
</script>
